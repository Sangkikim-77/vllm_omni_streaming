version: '3.8'

services:
  vllm-omni-streaming:
    build:
      context: .
      dockerfile: Dockerfile
    image: vllm-omni-streaming:latest
    container_name: vllm-omni-streaming
    shm_size: '64gb'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['4', '5', '6', '7']
              capabilities: [gpu]
    ports:
      - "9101:9101"
      - "9102:9102"
      - "9103:9103"
    volumes:
      - ./:/workspace/vllm_omni_streaming
      - ~/workspace/huggingface:/root/.cache/huggingface
      - ~/workspace:/workspace
    environment:
      - CUDA_VISIBLE_DEVICES=0,1,2,3
      - HF_DATASETS_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
      - VLLM_ATTENTION_BACKEND=FLASH_ATTN
      - PYTHONPATH=/vllm_omni_streaming/vllm
    stdin_open: true
    tty: true
    restart: unless-stopped